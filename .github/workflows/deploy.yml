name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  # Every width the visual check knows, each night, since a push checks only the widths a design review looks at.
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Per event, so the nightly run never cancels a push that is on its way to deploy.
concurrency:
  group: pages-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'
      # .npmrc's min-release-age needs npm 11.10 or later, which the LTS node does not always ship.
      - run: npm install --global npm@11.20.0
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ vars.VITE_GOOGLE_API_KEY }}
          VITE_GOOGLE_PROJECT_NUMBER: ${{ vars.VITE_GOOGLE_PROJECT_NUMBER }}
          VITE_BANK_SYNC_DEPLOYMENT: ${{ vars.VITE_BANK_SYNC_DEPLOYMENT }}
      # After the build, which writes Nuxt UI's theme types, so a colour outside the theme fails.
      - name: Typecheck
        run: npm run typecheck
      # Serves dist/ itself and sends every other origin to a dead proxy, so it calls no Google API.
      - name: Offline and update check
        run: npm run check:pwa
      - name: Import of files another program wrote
        run: npm run check:import
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  # Side by side with verify, each on its own machine, since one machine takes nearly two hours for all of them.
  # A push runs the visual shards at the four widths a design review looks at, and the nightly run at all nine.
  # The touch check splits by width, since each width is one session whose steps build on each other.
  checks:
    name: ${{ matrix.check }} check ${{ matrix.selection }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { check: visual, selection: --shard 1/16 }
          - { check: visual, selection: --shard 2/16 }
          - { check: visual, selection: --shard 3/16 }
          - { check: visual, selection: --shard 4/16 }
          - { check: visual, selection: --shard 5/16 }
          - { check: visual, selection: --shard 6/16 }
          - { check: visual, selection: --shard 7/16 }
          - { check: visual, selection: --shard 8/16 }
          - { check: visual, selection: --shard 9/16 }
          - { check: visual, selection: --shard 10/16 }
          - { check: visual, selection: --shard 11/16 }
          - { check: visual, selection: --shard 12/16 }
          - { check: visual, selection: --shard 13/16 }
          - { check: visual, selection: --shard 14/16 }
          - { check: visual, selection: --shard 15/16 }
          - { check: visual, selection: --shard 16/16 }
          # The shards run with hidden scrollbars, so the shell's flows and the docked chat run once more with a classic scrollbar's gutter.
          - { check: visual, selection: "--classic-scrollbars --only 'sidebar*,chat-resize,shell-squeeze,menu-lit,skip-link,quick-jump*'" }
          - { check: touch, selection: --widths 360 }
          - { check: touch, selection: --widths 430 }
          - { check: firefox, selection: '' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'
      # .npmrc's min-release-age needs npm 11.10 or later, which the LTS node does not always ship.
      - run: npm install --global npm@11.20.0
      - run: npm ci
      # ubuntu-latest ships Chrome at /usr/bin/google-chrome and Firefox at /usr/bin/firefox, which the checks probe for.
      # They run against the fake build, so every screen has data and no Google call is made.
      # The check serves the fake build itself and stops the server when it ends.
      - name: Check
        run: |
          npm run build:fake
          npm run check:${{ matrix.check }} -- --serve fake ${{ matrix.selection }} ${{ matrix.check == 'visual' && startsWith(matrix.selection, '--shard') && github.event_name != 'schedule' && '--widths 360,640,1024,1440' || '' }}
      # The shots go with the runner, so only the processes, profiles and containers a run leaves count here.
      - name: Nothing left over
        if: always()
        run: npm run check:leftovers -- --with-shots

  deploy:
    if: github.event_name != 'schedule'
    needs: [verify, checks]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
